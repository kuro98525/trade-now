<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环境探针 · 内嵌浏览器检测</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0b0b0f;color:#e8e8ef;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:17px;margin:0 0 4px}
.sub{color:#8b8b9a;font-size:12.5px;margin-bottom:16px}
.card{background:#14141a;border:1px solid #24242e;border-radius:14px;padding:14px;margin-bottom:12px}
.k{color:#8b8b9a;font-size:12px;margin-bottom:3px}
.v{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#e8e8ef}
.v.ok{color:#00e5a0}.v.no{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 0;border-bottom:1px solid #1e1e26;vertical-align:top}
td:first-child{color:#8b8b9a;width:44%}
td:last-child{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
button,a.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:11px;background:#00e5a0;color:#06110c;font-weight:700;font-size:14px;border:0;margin-top:9px;text-decoration:none;font-family:inherit}
button.ghost,a.ghost{background:#191920;color:#c9c9d6;border:1px solid #2a2a34;font-weight:500}
pre{white-space:pre-wrap;word-break:break-all;background:#0b0b0f;border:1px dashed #2c2c38;border-radius:10px;padding:11px;font-size:11.5px;color:#b9b9c6;margin:10px 0 0}
</style>
</head>
<body>
<h1>环境探针</h1>
<div class="sub">在这个页面上截个图，我就能确定你现在到底在哪个浏览器内核里、为什么没跳出去。</div>

<div class="card">
  <table id="rows"></table>
</div>

<div class="card">
  <div class="k">User-Agent 原文</div>
  <div class="v" id="ua">…</div>
  <pre id="dump">…</pre>
  <button class="ghost" id="copyUa" type="button">复制全部信息</button>
</div>

<div class="card">
  <div class="k">手动试一下跳转</div>
  <a class="btn" id="trySafari" href="#">x-safari-https 跳 Safari</a>
  <a class="btn ghost" id="tryIntent" href="#">intent:// 跳默认浏览器</a>
  <div class="sub" style="margin:10px 0 0">iOS 上第一个生效；Android 上第二个生效。哪个能跳出，就把哪种方案设为主按钮。</div>
</div>

<script>
(function(){
  'use strict';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  function has(name){ try { return typeof window[name] !== 'undefined'; } catch(e){ return false; } }
  var tg = has('TelegramWebview') || has('TelegramWebviewProxy') || has('TelegramWebviewProxyProto');

  var rows = [
    ['设备类型', isIOS ? 'iOS' : (isAndroid ? 'Android' : '桌面/其它')],
    ['Telegram 注入对象', tg ? '有（= Telegram 自家 WebView）' : '没有'],
    ['UA 含 Telegram', /Telegram/i.test(ua) ? '是' : '否'],
    ['UA 含 "; wv)"', /; wv\)/i.test(ua) ? '是（Android WebView）' : '否'],
    ['UA 含 Safari', /Safari/.test(ua) ? '是' : '否'],
    ['UA 含 CriOS', /CriOS/.test(ua) ? '是（iOS Chrome）' : '否'],
    ['UA 含 FxiOS', /FxiOS/.test(ua) ? '是（iOS Firefox）' : '否'],
    ['是否独立窗口', (navigator.standalone === true) ? '是（PWA）' : '否'],
    ['纯触屏桌面', (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? '是（iPadOS 桌面 UA）' : '否'],
    ['屏幕', screen.width + ' × ' + screen.height + '  dpr=' + (window.devicePixelRatio||1)],
    ['视口', innerWidth + ' × ' + innerHeight],
    ['语言', navigator.language || ''],
    ['当前地址', location.href]
  ];
  var html = '';
  for (var i=0;i<rows.length;i++){
    var mark = '';
    if (rows[i][0] === 'Telegram 注入对象') mark = tg ? ' class="v ok"' : ' class="v no"';
    html += '<tr><td>' + rows[i][0] + '</td><td' + (mark||'') + '>' + rows[i][1] + '</td></tr>';
  }
  document.getElementById('rows').innerHTML = html;
  document.getElementById('ua').textContent = ua;

  var dump =
    'UA=' + ua + '\n' +
    'isIOS=' + isIOS + ' isAndroid=' + isAndroid + '\n' +
    'TelegramWebview=' + tg + '\n' +
    'platform=' + navigator.platform + ' maxTouchPoints=' + navigator.maxTouchPoints + '\n' +
    'standalone=' + navigator.standalone + '\n' +
    'screen=' + screen.width + 'x' + screen.height + ' dpr=' + (window.devicePixelRatio||1) + '\n' +
    'viewport=' + innerWidth + 'x' + innerHeight + '\n' +
    'href=' + location.href;
  document.getElementById('dump').textContent = dump;

  document.getElementById('copyUa').addEventListener('click', function(){
    var b = this;
    var done = function(){ b.textContent = '已复制'; setTimeout(function(){ b.textContent = '复制全部信息'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(dump).then(done, function(){});
    } else {
      try {
        var ta = document.createElement('textarea'); ta.value = dump;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); done();
      } catch(e){}
    }
  });

  var base = location.origin + location.pathname.replace(/probe\.html$/, 'index.html');
  var bare = base.replace(/^https?:\/\//i, '');
  document.getElementById('trySafari').href = 'x-safari-https://' + bare;
  var m = /^(https?):\/\/([^\/?#]+)([^?#]*)/i.exec(base);
  document.getElementById('tryIntent').href = m
    ? 'intent://' + m[2] + (m[3] || '/') + '#Intent;scheme=' + m[1].toLowerCase() +
      ';S.browser_fallback_url=' + encodeURIComponent(base) + ';end'
    : base;
})();
</script>
</body>
</html>
